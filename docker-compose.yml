services:
  database:
    image: postgres:16-alpine
    container_name: benchmark_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: crdt_benchmark
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7-jammy
    container_name: benchmark_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: crdt_benchmark
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db

  mongo_setup:
    image: mongo:7-jammy
    container_name: mongo_setup
    depends_on:
      - mongo
    restart: "no"
    command: >
      bash -c "sleep 5 && mongosh -u admin -p password123 --authenticationDatabase admin --host benchmark_mongo:27017 --eval 'try { rs.status(); } catch (err) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"benchmark_mongo:27017\" }] }); }'"

volumes:
  postgres_data:
  mongo_data:
    